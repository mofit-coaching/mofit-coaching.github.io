<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TEST — ماسح الباركود</title>
<link rel="stylesheet" href="styles.css?v=c84d2e1f">
<style>
  body{padding:14px;max-width:430px;margin:0 auto}
  .testbanner{position:sticky;top:0;z-index:50;background:#DC2626;color:#fff;font-weight:800;text-align:center;padding:10px;border-radius:12px;margin-bottom:12px;font-size:.9rem}
  .tbtns{display:grid;gap:8px;margin:14px 0}
  /* minimal sheet shell, same shape as the app's #sheet */
  #sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:flex-end}
  #sheet.hidden{display:none}
  #sheetBody{background:var(--base,#F8FAFC);width:100%;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 16px;border-radius:12px;z-index:99999;font-size:.85rem}
  .unitbox{background:#0F172A;color:#fff;border-radius:16px;padding:14px;margin:12px 0}
  .unitbox .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center}
  .unitbox .g4 b{display:block;font-size:1.05rem}
  .unitbox .g4 small{color:#CBD5E1}
  .stepper{display:flex;gap:8px;margin:8px 0}
  .stepper button{width:44px;border-radius:12px;border:1.5px solid var(--soft,#E2E8F0);background:#fff;font-size:1.2rem;cursor:pointer}
  .stepper input{flex:1;text-align:center;border:1.5px solid var(--soft,#E2E8F0);border-radius:12px;padding:10px;font-size:1.05rem}
  .chip{border:1.5px solid var(--soft,#E2E8F0);background:#fff;border-radius:99px;padding:7px 13px;font-size:.8rem;font-weight:700;cursor:pointer;flex:none}
  .scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
  .btn{border:none;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer}
  .btn.primary{background:linear-gradient(135deg,#FF5A0A,#FFA24D);color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{padding:7px 12px;font-size:.85rem}
  .btn.block{width:100%}
  .between{display:flex;justify-content:space-between;align-items:center}
  .card{background:#fff;border-radius:16px;padding:12px}
  .empty{text-align:center;padding:28px 10px;color:var(--slate,#64748B)}
  .empty .big{font-size:2rem;display:block;margin-bottom:8px}
  .muted{color:var(--slate,#64748B);font-size:.82rem}
  #fpQ{width:100%;border:1.5px solid var(--soft,#E2E8F0);border-radius:14px;padding:12px 14px}
  input{font:inherit}
</style>
</head>
<body>
<div class="testbanner">⚠️ صفحة اختبار TEST — مش جزء من التطبيق ولا فيها بيانات عملاء</div>
<h3 style="margin:6px 0">اختبار ماسح الباركود (barcode.js)</h3>
<p class="muted">الصفحة دي بتحاكي شاشة «سجّل صنف» علشان نجرّب زرار الباركود والماسح وكارت المنتج من غير حسابات حقيقية. الـ Supabase هنا وهمي (stub) — مفيش أي حاجة بتتكتب في قاعدة البيانات.</p>
<div class="tbtns">
  <button class="btn primary" id="tOpen">🍽 افتح شاشة تسجيل الصنف</button>
  <button class="btn" style="background:#0F172A;color:#fff" id="tNut">🍫 جرّب منتج حقيقي: نوتيلا 3017620422003 (من Open Food Facts)</button>
  <button class="btn" style="background:#0F172A;color:#fff" id="tMiss">🚫 جرّب باركود مش موجود 0000000000000</button>
</div>
<div id="sheet" class="hidden"><div id="sheetBody"></div></div>

<script>
/* ---- minimal stubs of the app's globals (no real app code, no real data) ---- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (v, d=0) => v === null || v === undefined || isNaN(v) ? "—" : (+v).toLocaleString("en-US",{maximumFractionDigits:d});
const num = v => (v === "" || v === null || v === undefined || isNaN(+v)) ? null : +v;
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function emptyBox(icon, text){ return `<div class="empty"><span class="big">${icon}</span>${text}</div>`; }
function openSheet(html){ $("#sheetBody").innerHTML=html; $("#sheet").classList.remove("hidden"); return $("#sheetBody"); }
function closeSheet(){ $("#sheet").classList.add("hidden"); $("#sheetBody").innerHTML=""; }
/* fake supabase: never finds, never inserts — proves the fallback path logs anyway */
const sb = { from:()=>({
  select:()=>({ ilike:()=>({ limit:async()=>({data:[]}) }) }),
  insert:()=>({ select:()=>({ single:async()=>({data:null,error:{message:"test stub: inserts disabled"}}) }) })
}) };
/* the real views.js openFoodPicker, trimmed to the part barcode.js hooks */
function openFoodPicker(title, onPick, opts={}){
  const body=openSheet(`<div class="between"><b>${esc(title)}</b><button class="btn sm ghost" data-close>✕</button></div>
    <input id="fpQ" placeholder="🔍 اكتب اسم الصنف (حرفين على الأقل)…" style="margin-top:10px" autocomplete="off"><div id="fpRes" style="margin-top:8px"></div>`);
  body.querySelector("[data-close]").onclick=closeSheet;
}
/* demo onPick: shows exactly what would be logged */
function demoPick(food,qty){
  closeSheet();
  toast("هيتسجّل: "+food.name+" — "+qty+" "+food.unit+" ("+fmt((food.kcal||0)*qty/100)+" kcal)"+(food.id===undefined?" · بدون foods row (fallback)":" · foods id "+food.id));
  document.getElementById("tLog").insertAdjacentHTML("afterbegin",
    `<div class="card" style="margin-top:8px"><b>${esc(food.name)}</b> · ${fmt(qty)} ${esc(food.unit)} · ${fmt((food.kcal||0)*qty/100)} kcal<br>
     <small class="muted">ب ${fmt((food.protein||0)*qty/100,1)} · ك ${fmt((food.carbs||0)*qty/100,1)} · د ${fmt((food.fat||0)*qty/100,1)}${food.id===undefined?" · <b style='color:#DC2626'>food_id مش موجود — fallback</b>":""}</small></div>`);
}
document.getElementById("tOpen").onclick=()=>openFoodPicker("سجّل في الغدا",demoPick);
</script>
<script src="barcode.js"></script>
<script>
/* drive the product-card path through the real barcode.js internals */
document.getElementById("tNut").onclick=async()=>{
  openFoodPicker("سجّل في الغدا",demoPick);
  const body=document.querySelector("#sheetBody");
  const res=await fetch("https://world.openfoodfacts.org/api/v2/product/3017620422003.json?fields=code,product_name,product_name_ar,brands,quantity,serving_size,serving_quantity,nutriments").then(r=>r.json()).catch(()=>null);
  if(!res||!res.product){ toast("مفيش نت"); return; }
  /* fake a scan: re-use barcode.js's own flow by simulating a manual code submit */
  openFoodPicker("سجّل في الغدا",demoPick);
  const row=document.querySelector("#sheetBody .bc-row button");
  row.click(); /* opens scanner overlay */
  document.querySelector(".bc-manual").classList.add("open");
  document.getElementById("bcCode").value="3017620422003";
  document.getElementById("bcGo").click();
};
document.getElementById("tMiss").onclick=()=>{
  openFoodPicker("سجّل في الغدا",demoPick);
  document.querySelector("#sheetBody .bc-row button").click();
  document.querySelector(".bc-manual").classList.add("open");
  document.getElementById("bcCode").value="0000000000000";
  document.getElementById("bcGo").click();
};
</script>
<div id="tLog"></div>
</body>
</html>
