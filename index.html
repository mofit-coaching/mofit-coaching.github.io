<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mofit</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* 60% base #F8FAFC · 30% navy #0F172A/#1E293B · 10% orange #F97316 */
:root{
  --base:#F8FAFC; --card:#fff; --navy:#0F172A; --navy2:#1E293B; --navy3:#334155; --slate:#64748B; --soft:#E2E8F0; --soft2:#F1F5F9;
  --acc:#F97316; --acc2:#FB923C; --acc-soft:#FFF7ED; --acc-line:#FED7AA;
  --good:#16A34A; --good-soft:#DCFCE7; --bad:#DC2626; --bad-soft:#FEE2E2;
  --r:18px; --sh:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--base);color:var(--navy);font:15px/1.55 "Cairo","Segoe UI",Tahoma,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
/* header */
.top{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(249,115,22,.28),transparent 65%);top:-90px;left:-60px;pointer-events:none}
.top-row{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:.5px}.logo b{color:var(--acc)}
.top .sp{flex:1}
.ibtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:6px 11px;cursor:pointer;font-size:.8rem}
.hello{margin-top:14px;display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hello .av{width:52px;height:52px;font-size:1.3rem}
.hello h1{margin:0;font-size:1.25rem;line-height:1.3}
.hello p{margin:0;color:#CBD5E1;font-size:.82rem}
.hello .ringwrap{margin-inline-start:auto}
main{padding:16px 14px calc(100px + env(safe-area-inset-bottom));max-width:780px;margin:auto}
/* nav */
.nav{position:fixed;bottom:10px;left:10px;right:10px;z-index:30;background:var(--navy);border-radius:22px;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom)/2);box-shadow:0 10px 30px rgba(15,23,42,.35);max-width:760px;margin:auto}
.nav button{flex:1;background:none;border:0;color:#94A3B8;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;padding:4px 0;cursor:pointer;border-radius:14px;transition:.2s}
.nav button svg{width:22px;height:22px}
.nav button.on{color:#fff}
.nav button.on svg{color:var(--acc)}
.nav button.on span{font-weight:700}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h .ic{width:36px;height:36px;border-radius:12px;background:var(--soft2);display:grid;place-items:center;font-size:1.1rem;flex:none}
.card-h .ic.acc{background:var(--acc-soft)}
.card-h .ic.dark{background:var(--navy);color:#fff}
.card-h h2{margin:0;font-size:1rem;flex:1;line-height:1.3}
.card-h h2 small{display:block;font-weight:400;color:var(--slate);font-size:.75rem}
.card.dark{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.card.dark .card-h h2 small,.card.dark .hint{color:#CBD5E1}
.card.dark .card-h .ic{background:rgba(255,255,255,.1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:460px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}
.stat{background:var(--soft2);border-radius:14px;padding:10px 12px}
.stat .l{font-size:.72rem;color:var(--slate)}
.stat .v{font-size:1.25rem;font-weight:800;line-height:1.25}
.stat .s{font-size:.7rem;color:var(--slate)}
.stat.dark{background:var(--navy);color:#fff}.stat.dark .l,.stat.dark .s{color:#94A3B8}
.stat.acc .v{color:var(--acc)}
.hint{color:var(--slate);font-size:.78rem;margin:6px 0 0}
.muted{color:var(--slate);font-size:.82rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1;min-width:110px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* forms */
label.f{display:block;font-size:.76rem;color:var(--slate);margin-bottom:10px;font-weight:600}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px}
input,select,textarea{border:1.5px solid var(--soft);background:#fff;border-radius:12px;padding:9px 11px;min-height:44px;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
.btn{border:1.5px solid var(--soft);background:#fff;border-radius:12px;padding:9px 16px;cursor:pointer;min-height:44px;font-weight:600;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 16px rgba(249,115,22,.3)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--slate)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{min-height:34px;padding:4px 11px;font-size:.82rem;border-radius:10px}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:.72rem;font-weight:700;background:var(--soft2);color:var(--navy3);white-space:nowrap}
.pill.navy{background:var(--navy);color:#fff}.pill.acc{background:var(--acc);color:#fff}.pill.acc-soft{background:var(--acc-soft);color:#C2410C}
.pill.good{background:var(--good-soft);color:#166534}.pill.glass{background:rgba(255,255,255,.12);color:#fff}
.pill:empty{display:none}
/* chips / scrollers */
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.scroller::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--soft);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:.84rem;min-height:36px;white-space:nowrap;font-weight:600;flex:none}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.cur{border-color:var(--acc);color:var(--acc)}
.chip.on.cur{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:flex;background:var(--soft2);border-radius:14px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.82rem;color:var(--slate);white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.daycard{flex:none;width:118px;scroll-snap-align:start;border-radius:16px;padding:10px 12px;background:#fff;border:1.5px solid var(--soft);cursor:pointer;text-align:start;position:relative}
.daycard b{display:block;font-size:.95rem}
.daycard small{display:block;color:var(--slate);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daycard.on{background:var(--navy);border-color:var(--navy);color:#fff}.daycard.on small{color:#CBD5E1}
.daycard.rest{background:var(--soft2);border-style:dashed}
.daycard .dot{position:absolute;top:8px;left:10px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
/* progress */
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .6s}
.bar.navy>i{background:var(--navy)}.bar.over>i{background:var(--bad)}
.macro{margin-bottom:10px}
.macro .between{font-size:.82rem}
.macro b{font-size:.95rem}
/* tables */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.82rem}
th,td{padding:8px 5px;text-align:center;border-bottom:1px solid var(--soft2)}
th{color:var(--slate);font-weight:700;font-size:.72rem}
td.cur,th.cur{background:var(--acc-soft)} th.cur{color:var(--acc)}
.scrollx{overflow-x:auto}
/* heatmap */
.heat{display:grid;grid-template-columns:28px repeat(7,1fr);gap:4px;font-size:.66rem;color:var(--slate);align-items:center}
.heat i{display:block;aspect-ratio:1;border-radius:6px;background:var(--soft2)}
.heat i.l1{background:#FED7AA}.heat i.l2{background:#FDBA74}.heat i.l3{background:#FB923C}.heat i.l4{background:#F97316}
.heat i.today{outline:2px solid var(--navy);outline-offset:1px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--navy),var(--navy2) 60%,#3b1d0b)}
.login-art{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;padding:40px 20px 20px;text-align:center}
.logo-big{font-size:3.4rem;font-weight:800;letter-spacing:2px}.logo-big b{color:var(--acc)}
.login-art p{color:#CBD5E1;margin:4px 0 0}
.login-card{background:#fff;border-radius:28px 28px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));width:100%;max-width:480px;margin:0 auto}
.login-card h2{margin:0 0 14px}
.err{color:var(--bad);font-size:.84rem;min-height:1.2em}
/* training */
.ex{background:#fff;border-radius:var(--r);margin-bottom:14px;box-shadow:var(--sh);overflow:hidden}
.ex-h{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.ex-n{width:30px;height:30px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-weight:800;flex:none}
.ex-t{flex:1;min-width:0}
.ex-t b{display:block;font-size:.92rem;line-height:1.35;cursor:pointer}
.ex-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.play{width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:var(--acc);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.play svg{width:16px;height:16px;margin-inline-start:2px}
.ex-b{padding:10px 12px}
.tempo{display:flex;gap:4px;margin:2px 0 8px}
.tempo div{flex:1;background:var(--soft2);border-radius:10px;padding:5px 2px;text-align:center;font-size:.66rem;color:var(--slate)}
.tempo div b{display:block;font-size:1rem;color:var(--navy)}
.set-head,.set{display:grid;grid-template-columns:28px 1fr 1fr 62px 42px 30px;gap:6px;align-items:center}
.set-head{font-size:.66rem;color:var(--slate);text-align:center;margin-bottom:4px;font-weight:700}
.set{margin-bottom:6px}
.set .no{width:26px;height:26px;border-radius:8px;background:var(--soft2);display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--slate)}
.set.done .no{background:var(--good);color:#fff}
.set input,.set select{min-height:42px;padding:6px 4px;text-align:center;font-weight:700}
.set .prev{grid-column:2/-1;font-size:.68rem;color:var(--slate);margin-top:-3px}
.fail{border:1.5px solid var(--soft);background:#fff;border-radius:12px;min-height:42px;cursor:pointer;font-size:1.05rem;filter:grayscale(1);opacity:.45}
.fail.on{filter:none;opacity:1;border-color:var(--acc);background:var(--acc-soft)}
.more{border:0;background:none;color:var(--slate);cursor:pointer;font-size:1.1rem}
.set-x{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 2fr;gap:6px;margin:-2px 0 8px}
.restbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:4px}
/* timer */
.timer{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;background:var(--navy);color:#fff;border-radius:20px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(15,23,42,.4);max-width:740px;margin:auto}
.timer .t-info{flex:1;min-width:0}
.timer .t-info b{display:block;font-size:.9rem}
.timer .t-info small{color:#94A3B8;font-size:.72rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .ibtn{padding:8px 10px}
.timer.done{background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
/* sheet */
.sheet{position:fixed;inset:0;z-index:60}
.sheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px)}
.sheet-card{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:680px;margin:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-grab{width:44px;height:5px;border-radius:9px;background:var(--soft);margin:4px auto 12px}
.video{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* food */
.meal{background:#fff;border-radius:var(--r);margin-bottom:14px;box-shadow:var(--sh);overflow:hidden}
.meal-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--soft2)}
.meal-h .ic{width:38px;height:38px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;font-size:1.15rem}
.meal-h b{flex:1}
.meal-h b small{display:block;font-weight:400;color:var(--slate);font-size:.72rem}
.sub{font-size:.7rem;font-weight:800;color:var(--slate);padding:8px 14px 2px;letter-spacing:.3px}
.item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--soft2);font-size:.86rem}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0}
.item .nm small{display:block;color:var(--slate);font-size:.72rem}
.item .kc{font-weight:800;font-size:.85rem;white-space:nowrap}
.item.plan{background:#FCFDFE}
.tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--soft);background:#fff;cursor:pointer;display:grid;place-items:center;flex:none;font-size:.9rem;color:transparent}
.tick:hover{border-color:var(--good);color:var(--good)}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.x{border:0;background:none;color:#94A3B8;cursor:pointer;font-size:1rem;padding:4px}
.meal-f{display:flex;gap:8px;padding:10px 14px;background:var(--soft2)}
.food-r{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;cursor:pointer;border:1.5px solid transparent}
.food-r:hover{background:var(--soft2)}
.food-r .fi{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;flex:none}
.food-r .nm{flex:1;min-width:0;font-size:.88rem}
.food-r small{display:block;color:var(--slate);font-size:.72rem}
.unitbox{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:14px;margin:8px 0 12px}
.unitbox .u{display:inline-block;background:var(--acc);border-radius:99px;padding:2px 12px;font-weight:800;font-size:.8rem}
.unitbox .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}
.unitbox .g4 div{background:rgba(255,255,255,.08);border-radius:12px;padding:6px 2px}
.unitbox .g4 b{display:block;font-size:1.05rem}
.unitbox .g4 small{color:#CBD5E1;font-size:.66rem}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:46px;height:46px;border-radius:14px;border:1.5px solid var(--soft);background:#fff;font-size:1.3rem;font-weight:800;cursor:pointer}
.stepper input{text-align:center;font-size:1.3rem;font-weight:800}
/* coach */
.client{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;cursor:pointer;transition:.15s}
.client:hover{background:var(--soft2)}
.av{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:1.05rem}
.client .nm{flex:1;min-width:0}
.client .nm b{display:block}
.client .nm small{display:block;color:var(--slate);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coachbar{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--acc-line);border-radius:16px;padding:8px 10px;margin-bottom:14px;box-shadow:var(--sh)}
.coachbar b{flex:1;font-size:.9rem}
.coachbar b small{display:block;font-weight:400;color:var(--slate);font-size:.72rem}
.coachbar .av{width:36px;height:36px;font-size:.9rem;border-radius:11px}
.pv{max-height:300px;overflow:auto;margin-top:8px}
.pv-day{background:var(--soft2);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.pv-h{display:flex;gap:8px;align-items:center;margin-bottom:4px}.pv-h b{flex:1;font-size:.86rem}.pv-h small{color:var(--slate);font-size:.72rem}
.pv-ex{display:flex;justify-content:space-between;gap:8px;font-size:.74rem;padding:2px 0;border-top:1px dashed var(--soft)}
.pv-ex em{font-style:normal;color:var(--slate);white-space:nowrap;direction:ltr}
.edit-ex{border:1.5px solid var(--soft);border-radius:16px;padding:10px;margin-bottom:10px;background:#fff}
.edit-ex .between b{font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));background:var(--navy);color:#fff;padding:10px 18px;border-radius:14px;z-index:80;font-size:.86rem;box-shadow:0 10px 30px rgba(15,23,42,.35);animation:up .2s}
.empty{text-align:center;color:var(--slate);padding:26px 10px}
.empty .big{font-size:2.2rem}
svg text{font-family:inherit}
.legend{display:flex;gap:12px;font-size:.7rem;color:var(--slate);flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft);margin-top:10px}
.stack i{display:block;height:100%}

</style>
</head>
<body>
<section id="loginView" class="login hidden">
  <div class="login-art"><div class="logo-big">MO<b>FIT</b></div><p>برنامجك · تغذيتك · تطورك — في مكان واحد</p></div>
  <form id="loginForm" class="login-card">
    <h2>تسجيل الدخول</h2>
    <label class="f">الإيميل<input id="loginEmail" type="email" autocomplete="username" required></label>
    <label class="f">كلمة السر<input id="loginPass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr"></p>
    <button class="btn primary block" type="submit">دخول</button>
  </form>
</section>
<section id="appView" class="hidden">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="nav" id="nav"></nav>
</section>
<div id="timer" class="timer hidden"></div>
<div id="sheet" class="sheet hidden"><div class="sheet-bg"></div><div class="sheet-card"><div class="sheet-grab"></div><div id="sheetBody"></div></div></div>
<script>

/* ---------- calculations (same formulas as the Mofit sheet) ---------- */
function currentWeek(p){ if(!p?.start_date) return 1; return Math.min(Math.max(Math.floor(daysBetween(p.start_date,today())/7)+1,1),12); }
function weekOfDate(p,iso){ if(!p?.start_date) return null; const w=Math.floor(daysBetween(p.start_date,iso)/7)+1; return w>=1&&w<=12?w:null; }
function targets(p){
  const r={bmr:null,tdee:null,kcal:null,P:null,C:null,F:null};
  if(p.sex&&p.age&&p.height_cm&&p.start_weight){
    r.bmr=10*p.start_weight+6.25*p.height_cm-5*p.age+(p.sex==="ذكر"?5:-161);
    r.tdee=r.bmr*(+p.activity_factor||1.2);
  }
  r.kcal = p.manual_kcal ? +p.manual_kcal : (r.tdee? r.tdee*(1+(+p.goal_adj||0)) : null);
  if(r.kcal){
    r.F=r.kcal*(+p.f_pct||0)/9;
    if(p.protein_gpk && p.start_weight){ r.P=p.start_weight*p.protein_gpk; r.C=Math.max(r.kcal-r.P*4-r.F*9,0)/4; }
    else { r.P=r.kcal*(+p.p_pct||0)/4; r.C=r.kcal*(+p.c_pct||0)/4; }
  }
  return r;
}
/* RIR-adjusted Epley: estimated 1RM = weight × (1 + (reps + RIR) / 30) */
function e1rm(s){ if(!s.weight||!s.reps) return null; return s.weight*(1+((+s.reps)+(+s.rir||0))/30); }
function isFailure(s){ return s.failure || (s.rir!==null && s.rir!==undefined && +s.rir===0); }
function logged(s){ return s.reps!==null&&s.reps!==undefined || s.weight!==null&&s.weight!==undefined; }
function sumMacros(items){ return items.reduce((a,i)=>({kcal:a.kcal+(+i.kcal||0),P:a.P+(+i.protein||0),C:a.C+(+i.carbs||0),F:a.F+(+i.fat||0)}),{kcal:0,P:0,C:0,F:0}); }

/* ---------- rest timer ---------- */
const T={end:0,total:0,iv:null,label:""};
let audioCtx=null;
function beep(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); [0,.25,.5].forEach(t=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.25,audioCtx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+t+.2); o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+.2); }); }catch{} navigator.vibrate?.([300,150,300]); }
function startRest(sec,label){ sec=Math.max(5,+sec||90); T.total=sec; T.end=Date.now()+sec*1000; T.label=label||""; clearInterval(T.iv); T.iv=setInterval(drawTimer,250); drawTimer(); try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume?.(); }catch{} }
function stopRest(){ clearInterval(T.iv); T.iv=null; $("#timer").classList.add("hidden"); }
function drawTimer(){
  const el=$("#timer"), left=Math.max(0,Math.round((T.end-Date.now())/1000));
  el.classList.remove("hidden"); el.classList.toggle("done",left===0);
  const mm=String(Math.floor(left/60)).padStart(2,"0"), ss=String(left%60).padStart(2,"0");
  el.innerHTML=`${ring(left,T.total,{size:54,stroke:6,color:"#F97316",track:"#334155",label:left?mm+":"+ss:"✓",textColor:"#fff"})}
    <div class="t-info"><b>${left?"⏱ وقت الراحة":"يلا المجموعة الجاية 💪"}</b><small>${esc(T.label)}</small></div>
    <button class="ibtn" data-t="-15">-15</button><button class="ibtn" data-t="15">+15</button><button class="ibtn" data-t="x">✕</button>`;
  el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ const v=b.dataset.t; if(v==="x") return stopRest(); T.end+= (+v)*1000; T.total=Math.max(T.total+(+v),5); if(T.end<Date.now()) T.end=Date.now(); if(!T.iv){T.iv=setInterval(drawTimer,250);} drawTimer(); });
  if(left===0 && T.iv){ clearInterval(T.iv); T.iv=null; beep(); setTimeout(()=>{ if(!T.iv) stopRest(); },8000); }
}

/* Coaching defaults; every value stays editable per client after applying. */
const LEVELS = {
  "مبتدئ": { icon:"🌱", desc:"مجموعات أقل · RIR 2-3 · تمبو بطيء للتكنيك · راحة أطول · 5 تمارين بحد أقصى",

    maxEx:8, setDelta:0, minSets:2,
    rir:{c:"1-2", i:"1"}, tempo:{c:"2-0-1-0", i:"2-1-1-0"}, rest:{c:120, i:75}, lastToFailure:false },

    maxEx:8, setDelta:0, compoundExtra:1, minSets:2,
    rir:{c:"1", i:"0-1"}, tempo:{c:"3-0-1-0", i:"3-1-1-0"}, rest:{c:180, i:90}, lastToFailure:true },
};
const COMPOUND_RE=/SQUAT|PRESS|ROW|DEADLIFT|PULLDOWN|PULL-UP|DIP|THRUST|SPLIT|LUNGE|HIP EXTENSION/i;
const isCompound=n=>COMPOUND_RE.test(n) && !/FLY|RAISE|CURL|EXTENSION MACHINE|PUSHDOWN|CRUNCH/i.test(n);
/* exercise tuple: [name, sets, reps, rir, rest, tempo, notes, video] */
function adaptPlan(plan, level){
  const L=LEVELS[level]||LEVELS["متوسط"];
  return plan.map(day=>({label:day.label, ex:day.ex.slice(0,L.maxEx).map(e=>{
    const c=isCompound(e[0]);
    let sets=(e[1]||3)+L.setDelta+(c&&L.compoundExtra?L.compoundExtra:0);
    sets=Math.max(L.minSets,Math.min(sets,6));
    const note=[e[6], (!c&&L.lastToFailure)?"آخر مجموعة للفشل 🔥":null].filter(Boolean).join(" · ")||null;
    return [e[0], sets, e[2]||(c?"6-10":"10-15"), c?L.rir.c:L.rir.i, c?L.rest.c:L.rest.i, c?L.tempo.c:L.tempo.i, note, e[7]||null];
  })}));
}
function planRows(clientId, plan){
  const rows=[];
  plan.forEach((day,i)=>day.ex.forEach((e,j)=>rows.push({client_id:clientId,day_no:i+1,position:j,day_label:day.label,name:e[0],sets:e[1]||3,target_reps:e[2]||null,target_rir:e[3]||null,rest_sec:e[4]||null,tempo:e[5]||null,notes:e[6]||null,video_url:e[7]||null})));
  return rows;
}
/* coach-saved programs are applied as saved (no level adjustment) */
function resolvePlan(sys, level){ return sys.custom ? sys.plan : adaptPlan(sys.plan, level); }
async function applyProgram(client, sys, level){
  const plan=resolvePlan(sys, level);
  const { error:de } = await sb.from("program_exercises").delete().eq("client_id",client.id);
  if(de){ toast(de.message); return false; }
  const { error } = await sb.from("program_exercises").insert(planRows(client.id, plan));
  if(error){ toast(error.message); return false; }
  await sb.from("profiles").update({training_days:plan.length, split_key:sys.key, split_name:sys.name, level}).eq("id",client.id);
  return true;
}

    <div class="stat ${ch!==null&&ch<0?"acc":""}"><div class="l">التغيّر</div><div class="v num">${ch===null?"—":(ch>0?"+":"")+fmt(ch,1)}</div><div class="s">كجم منذ البداية</div></div>
    <div class="stat"><div class="l">BMI</div><div class="v num">${fmt(bmi,1)}</div></div></div>${lineChart(B.map(b=>({x:b.week,y:+b.weight})),"الوزن (كجم)")}`;
}
function heatmap(p,H){
  const by=Object.fromEntries(H.map(h=>[h.log_date,dayScore(h)]));
  const start=p.start_date||today(), wk=currentWeek(p);
  let html=`<div class="heat"><span></span>${["1","2","3","4","5","6","7"].map(d=>`<span style="text-align:center">${d}</span>`).join("")}`;
  for(let w=1;w<=Math.max(wk,4)&&w<=12;w++){
    html+=`<span>أ${w}</span>`;
    for(let d=0;d<7;d++){ const iso=addDays(start,(w-1)*7+d), s=by[iso]; const lv=s===undefined||s===null?"":s>=.9?"l4":s>=.7?"l3":s>=.45?"l2":"l1"; html+=`<i class="${lv} ${iso===today()?"today":""}" title="${iso}"></i>`; }
  }
  return html+`</div><div class="legend"><span><i style="background:#FED7AA"></i>ضعيف</span><span><i style="background:#FB923C"></i>كويس</span><span><i style="background:#F97316"></i>ممتاز</span></div>`;
}
function failureSummary(sets){
  const done=sets.filter(logged);
  if(!done.length) return emptyBox("🏋️","لسه مفيش مجموعات مسجلة الأسبوع ده");
  const fail=done.filter(isFailure).length, near=done.filter(s=>!isFailure(s)&&s.rir!==null&&+s.rir<=2).length, far=done.length-fail-near;
  const w=v=>(v/done.length*100).toFixed(1)+"%";
  return `<div class="grid4"><div class="stat"><div class="l">مجموعات</div><div class="v">${done.length}</div></div>
    <div class="stat acc"><div class="l">🔥 للفشل</div><div class="v">${fail}</div></div>
    <div class="stat"><div class="l">RIR 1-2</div><div class="v">${near}</div></div>
    <div class="stat"><div class="l">متوسط RIR</div><div class="v num">${fmt(avg(done.map(s=>s.rir)),1)}</div></div></div>
    <div class="stack"><i style="width:${w(fail)};background:#F97316"></i><i style="width:${w(near)};background:#0F172A"></i><i style="width:${w(far)};background:#CBD5E1"></i></div>
    <div class="legend"><span><i style="background:#F97316"></i>فشل (RIR 0)</span><span><i style="background:#0F172A"></i>قريبة RIR 1-2</span><span><i style="background:#CBD5E1"></i>RIR 3+</span></div>`;
}

async function viewTrain(el){
  const p=S.client, wkNow=currentWeek(p), tdn=todayDayNo();
  const days=[...new Set(S.program.map(e=>e.day_no))].sort((a,b)=>a-b);
  if(!days.length){ el.innerHTML=`<div class="card">${emptyBox("📋","الكوتش لسه ما حطش برنامج التمرين."+(S.me.role==="coach"?"<br>حطه من تبويب ⚙️ التحكم.":""))}</div>`; return; }
  const maxD=Math.max(...days);
  el.innerHTML=`<div class="card"><div class="card-h"><div class="ic dark">📅</div><h2>${esc(p.split_name||"برنامج التمرين")}<small>${p.level?LEVELS[p.level]?.icon+" "+esc(p.level)+" · ":""}${days.length} أيام في الأسبوع</small></h2></div>
      <div class="scroller" id="dayCards">${[...Array(Math.min(7,maxD+1))].map((_,i)=>{ const d=i+1, has=days.includes(d); return `<button class="daycard ${S.day===d?"on":""} ${has?"":"rest"}" data-d="${d}">${d===tdn?'<span class="dot"></span>':""}<b>${has?"يوم "+d:"راحة"}</b><small>${has?esc(dayLabel(d)||S.program.filter(e=>e.day_no===d).length+" تمارين"):"😴 استشفاء"}</small></button>`; }).join("")}</div>
      <div class="muted" style="margin:8px 0 6px;font-weight:700">الأسبوع</div>
      <div class="scroller" id="wkChips">${[...Array(12)].map((_,i)=>`<button class="chip ${S.week===i+1?"on":""} ${wkNow===i+1?"cur":""}" data-w="${i+1}">${i+1}</button>`).join("")}</div></div>
    <div id="exList"></div><div class="card" id="failCard"></div>`;
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.day=+b.dataset.d; viewTrain(el);});
  el.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{S.week=+b.dataset.w; viewTrain(el);});
  const exs=S.program.filter(e=>e.day_no===S.day), list=$("#exList");
  if(!exs.length){ list.innerHTML=`<div class="card">${emptyBox("😴","يوم راحة واستشفاء<br>سجّل نومك ومياهك وخطواتك في العادات.")}</div>`; $("#failCard").remove(); return; }
  const ids=exs.map(e=>e.id);
  const { data } = await sb.from("set_logs").select("*").in("exercise_id",ids).in("week",[S.week,S.week-1].filter(w=>w>=1));
  const logs=data||[];
  const get=(ex,w,n)=>logs.find(l=>l.exercise_id===ex&&l.week===w&&l.set_no===n);
  exs.forEach((ex,idx)=>{
    const box=document.createElement("div"); box.className="ex"; const vid=videoFor(ex);
    box.innerHTML=`<div class="ex-h"><div class="ex-n">${idx+1}</div><div class="ex-t"><b data-vid>${esc(ex.name)}</b>
        <div class="ex-tags"><span class="pill glass">🎯 ${ex.sets}×${esc(ex.target_reps||"—")}</span>${ex.target_rir?`<span class="pill glass">RIR ${esc(ex.target_rir)}</span>`:""}${ex.rest_sec?`<span class="pill glass">⏱ ${ex.rest_sec}ث</span>`:""}${ex.tempo?`<span class="pill glass">🕒 ${esc(ex.tempo)}</span>`:""}<span class="pill acc" data-best></span></div></div>
        ${vid?`<button class="play" data-vid title="شاهد الأداء الصحيح">${ICON.play}</button>`:""}</div>
      <div class="ex-b">${ex.tempo?tempoBlocks(ex.tempo):""}${ex.notes?`<p class="hint" style="margin:0 0 8px">📝 ${esc(ex.notes)}</p>`:""}
        <div class="set-head"><span>#</span><span>العدات</span><span>الوزن كجم</span><span>RIR</span><span>فشل</span><span></span></div><div data-sets></div>
        <button class="btn sm restbtn" data-rest>⏱ ابدأ الراحة (${ex.rest_sec||90} ث)</button></div>`;
    box.querySelectorAll("[data-vid]").forEach(b=>b.onclick=()=>openVideo(ex));
    box.querySelector("[data-rest]").onclick=()=>startRest(ex.rest_sec||90, ex.name);
    const setsEl=box.querySelector("[data-sets]");
    const updBest=()=>{ const best=Math.max(0,...[...Array(ex.sets)].map((_,i)=>e1rm(get(ex.id,S.week,i+1)||{})||0)); box.querySelector("[data-best]").textContent=best?"1RM≈"+fmt(best,1):""; };
    for(let n=1;n<=ex.sets;n++){
      const cur=get(ex.id,S.week,n)||{}, prev=get(ex.id,S.week-1,n);
      const row=document.createElement("div"); row.className="set"+(logged(cur)?" done":"");
      row.innerHTML=`<div class="no">${n}</div>
        <input inputmode="numeric" placeholder="${esc(ex.target_reps||"عدات")}" value="${esc(cur.reps??"")}" data-k="reps">
        <input inputmode="decimal" placeholder="${prev?.weight??"كجم"}" value="${esc(cur.weight??"")}" data-k="weight">
        <select data-k="rir"><option value="">—</option>${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${cur.rir!==null&&cur.rir!==undefined&&+cur.rir===v?"selected":""}>${v}</option>`).join("")}</select>
        <button class="fail ${cur.failure?"on":""}" data-k="failure" title="وصلت للفشل">🔥</button>
        <button class="more" title="تمبو / راحة / ملاحظات">⋯</button>
        ${prev&&logged(prev)?`<div class="prev">الأسبوع اللي فات: <b class="num">${fmt(prev.reps)}×${fmt(prev.weight,1)}</b>${prev.rir!==null?" · RIR "+prev.rir:""}${isFailure(prev)?" · 🔥":""}</div>`:""}
        <div class="set-x hidden"><input placeholder="تمبو ${esc(ex.tempo||"")}" value="${esc(cur.tempo??"")}" data-k="tempo"><input inputmode="numeric" placeholder="راحة ث" value="${esc(cur.rest_sec??"")}" data-k="rest_sec"><input placeholder="ملاحظات" value="${esc(cur.notes??"")}" data-k="notes"></div>`;
      row.querySelector(".more").onclick=()=>row.querySelector(".set-x").classList.toggle("hidden");
      const save=async(startTimer)=>{
        const v=k=>row.querySelector(`[data-k="${k}"]`);
        const rec={ client_id:p.id, exercise_id:ex.id, week:S.week, set_no:n, reps:num(v("reps").value), weight:num(v("weight").value), rir:num(v("rir").value),
          failure:v("failure").classList.contains("on"), tempo:v("tempo").value.trim()||null, rest_sec:num(v("rest_sec").value), notes:v("notes").value.trim()||null };
        if(rec.rir===0){ rec.failure=true; v("failure").classList.add("on"); }
        const wasDone=row.classList.contains("done");
        const { data:saved, error } = await sb.from("set_logs").upsert(rec,{onConflict:"exercise_id,week,set_no"}).select().single();
        if(error){ toast("خطأ في الحفظ: "+error.message); return; }
        const i=logs.findIndex(l=>l.exercise_id===ex.id&&l.week===S.week&&l.set_no===n); if(i>=0) logs[i]=saved; else logs.push(saved);
        row.classList.toggle("done",logged(saved)); updBest(); renderFailCard();
        if(startTimer && !wasDone && rec.reps!==null && n<ex.sets) startRest(rec.rest_sec||ex.rest_sec||90, `${ex.name} · بعد مجموعة ${n}`);
      };
      row.querySelectorAll("input,select").forEach(i=>i.addEventListener("change",()=>save(i.dataset.k==="reps"||i.dataset.k==="weight")));
      row.querySelector(".fail").onclick=e=>{ e.currentTarget.classList.toggle("on"); save(false); };
      setsEl.appendChild(row);
    }
    updBest(); list.appendChild(box);
  });
  const renderFailCard=async()=>{
    const fc=$("#failCard"); if(!fc) return;
    const { data:all } = await sb.from("set_logs").select("exercise_id,week,reps,weight,rir,failure").eq("client_id",p.id);
    const A=(all||[]).filter(s=>ids.includes(s.exercise_id));
    let html=`<div class="card-h"><div class="ic acc">🔥</div><h2>متتبع الفشل العضلي<small>يوم ${S.day} · الأسبوع ${S.week}</small></h2></div>`+failureSummary(A.filter(s=>s.week===S.week));
    html+=`<div class="scrollx" style="margin-top:12px"><table><tr><th style="text-align:start">التمرين</th><th>🔥</th><th>أفضل 1RM</th><th>التطور</th></tr>`;
    exs.forEach(ex=>{
      const mine=A.filter(s=>s.exercise_id===ex.id), wk=mine.filter(s=>s.week===S.week);
      const best=w=>Math.max(0,...mine.filter(s=>s.week===w).map(s=>e1rm(s)||0));
      const nowB=best(S.week), prevW=[...Array(S.week-1)].map((_,i)=>S.week-1-i).find(w=>best(w)>0), prevB=prevW?best(prevW):0, diff=nowB&&prevB?(nowB-prevB)/prevB:null;
      html+=`<tr><td style="text-align:start;font-size:.74rem">${esc(ex.name)}</td><td>${wk.filter(isFailure).length}/${wk.filter(logged).length}</td><td class="num">${nowB?fmt(nowB,1):"—"}</td>
        <td>${diff===null?"—":`<span class="pill ${diff>=0?"good":"navy"}">${diff>=0?"▲":"▼"} ${Math.abs(diff*100).toFixed(1)}%</span>`}</td></tr>`;
    });
    fc.innerHTML=html+`</table></div><p class="hint">1RM تقديري = الوزن × (1 + (العدات + RIR) ÷ 30) · التطور مقارنة بآخر أسبوع مسجّل.</p>`;
  };
  renderFailCard();
}

    const term=q.value.trim(); if(term.length<2){ res.innerHTML=""; return; }
    const { data:f } = await sb.rpc("search_foods",{q:term});
    res.innerHTML=(f||[]).length?f.map(x=>{ const u=unitInfo(x); return `<div class="food-r" data-id="${x.id}"><div class="fi">${u.cnt?"🍞":"⚖"}</div><div class="nm">${esc(x.name)}<small>${u.base}: <b>${fmt(u.per.kcal)} kcal</b> · ب ${fmt(u.per.P,1)} · ك ${fmt(u.per.C,1)} · د ${fmt(u.per.F,1)}</small></div><span class="pill">${esc(x.unit)}</span></div>`; }).join("")

    body.innerHTML=`<div class="between"><button class="btn sm ghost" data-back>→ رجوع</button><button class="btn sm ghost" data-close>✕</button></div>
      <b style="font-size:1.05rem">${esc(food.name)}</b>

async function renderMeals(el,{mode}){
  const p=S.client, t=targets(p), meals=Math.max(1,Math.min(+p.meals_per_day||3,8)), planMode=mode==="plan";
  el.innerHTML=(planMode?"":`<div class="card"><div class="between"><button class="btn sm" id="dPrev">→</button><div style="text-align:center"><b>${niceDate(S.date)}</b><div class="muted num">${S.date}</div></div><button class="btn sm" id="dNext">←</button></div>
      <input type="date" id="fDate" value="${S.date}" style="margin-top:8px"></div>`)+`<div class="card dark" id="fTot"></div><div id="meals"></div>`;
  if(!planMode){
    $("#fDate").onchange=e=>{S.date=e.target.value; renderMeals(el,{mode});};
    $("#dPrev").onclick=()=>{S.date=addDays(S.date,-1); renderMeals(el,{mode});};
    $("#dNext").onclick=()=>{S.date=addDays(S.date,1); renderMeals(el,{mode});};
  }
  const [pl,lg]=await Promise.all([
    sb.from("diet_plan_items").select("*").eq("client_id",p.id).order("meal_no").order("position"),
    planMode?{data:[]}:sb.from("meal_items").select("*").eq("client_id",p.id).eq("log_date",S.date).order("created_at")]);
  const plan=pl.data||[], items=lg.data||[];
  const drawTot=()=>{ const tot=sumMacros(planMode?plan:items);
    $("#fTot").innerHTML=`<div class="card-h"><div class="ic">${planMode?"📋":"🔥"}</div><h2>${planMode?"إجمالي الخطة":"ملخص اليوم"}<small>${planMode?"مقارنة بأهداف العميل":"المتبقي: "+(t.kcal?fmt(t.kcal-tot.kcal):"—")+" kcal"}</small></h2></div>
      <div style="display:flex;gap:16px;align-items:center">${ring(tot.kcal,t.kcal||1,{size:112,track:"rgba(255,255,255,.15)",label:fmt(tot.kcal),sub:"من "+fmt(t.kcal),textColor:"#fff"})}
      <div style="flex:1;color:#fff">${macroRow("بروتين",tot.P,t.P,"جم")}${macroRow("كارب",tot.C,t.C,"جم")}${macroRow("دهون",tot.F,t.F,"جم")}</div></div>`; };
  drawTot();
  const wrap=$("#meals");
  for(let m=1;m<=meals;m++){
    const box=document.createElement("div"); box.className="meal"; let edit=planMode;
    const draw=()=>{
      const mp=plan.filter(i=>i.meal_no===m), ml=items.filter(i=>i.meal_no===m);
      const used=new Set(); const match=pi=>{ const x=ml.find(l=>!used.has(l.id)&&l.food_id===pi.food_id&&+l.qty===+pi.qty); if(x){used.add(x.id);} return x; };
      const planRows=mp.map(pi=>({pi, hit:planMode?null:match(pi)}));
      const extras=ml.filter(l=>!used.has(l.id));
      const sPlan=sumMacros(mp), sEat=sumMacros(ml);
      box.innerHTML=`<div class="meal-h"><div class="ic">${MEAL_ICONS[m-1]}</div><b>${esc(mealName(p,m))}<small>${planMode?`${fmt(sPlan.kcal)} kcal · ب ${fmt(sPlan.P)} · ك ${fmt(sPlan.C)} · د ${fmt(sPlan.F)}`:`أكلت ${fmt(sEat.kcal)} من ${fmt(sPlan.kcal)} kcal في الخطة`}</small></b>
          ${planMode?"":`<button class="btn sm ${edit?"navy":""}" data-edit>${edit?"تم":"✎ الخطة"}</button>`}</div>
        ${mp.length||edit?`<div class="sub">📋 خطة الكوتش</div>`:""}
        ${planRows.map(({pi,hit})=>`<div class="item plan">${planMode||edit?"":`<button class="tick ${hit?"on":""}" data-tick="${pi.id}" title="أكلتها">✓</button>`}
          <div class="nm">${esc(pi.food_name)}<small>${qtyText(pi)}${pi.notes?" · "+esc(pi.notes):""}</small></div><span class="kc num">${fmt(pi.kcal)}</span>${edit?`<button class="x" data-pdel="${pi.id}">✕</button>`:""}</div>`).join("")}
        ${!planMode&&extras.length?`<div class="sub">🍽 أكلت كمان</div>`+extras.map(i=>`<div class="item"><div class="nm">${esc(i.food_name)}<small>${qtyText(i)} · ب ${fmt(i.protein,1)} · ك ${fmt(i.carbs,1)} · د ${fmt(i.fat,1)}</small></div><span class="kc num">${fmt(i.kcal)}</span><button class="x" data-ldel="${i.id}">✕</button></div>`).join(""):""}
        ${!mp.length&&!ml.length&&!edit?`<div class="item"><span class="muted">مفيش أصناف لسه</span></div>`:""}
        <div class="meal-f">${edit?`<button class="btn sm navy grow" data-padd>+ صنف للخطة</button>`:`${mp.length?`<button class="btn sm grow" data-all>✓ أكلت الوجبة كلها</button>`:""}<button class="btn sm primary grow" data-ladd>+ سجّل صنف</button>`}</div>`;
      box.querySelector("[data-edit]")&&(box.querySelector("[data-edit]").onclick=()=>{edit=!edit; draw();});
      const logOne=async pi=>{ const rec={client_id:p.id,log_date:S.date,meal_no:m,food_id:pi.food_id,food_name:pi.food_name,unit:pi.unit,qty:pi.qty,kcal:pi.kcal,protein:pi.protein,carbs:pi.carbs,fat:pi.fat};
        const { data:ins, error } = await sb.from("meal_items").insert(rec).select().single(); if(error){ toast(error.message); return; } items.push(ins); };
      box.querySelectorAll("[data-tick]").forEach(b=>b.onclick=async()=>{
        const pr=planRows.find(r=>r.pi.id===b.dataset.tick);
        if(pr.hit){ const { error } = await sb.from("meal_items").delete().eq("id",pr.hit.id); if(error) return toast(error.message); items.splice(items.findIndex(i=>i.id===pr.hit.id),1); }
        else await logOne(pr.pi);
        draw(); drawTot(); });
      box.querySelector("[data-all]")&&(box.querySelector("[data-all]").onclick=async()=>{ for(const r of planRows) if(!r.hit) await logOne(r.pi); draw(); drawTot(); toast("✓ اتسجلت الوجبة"); });
      box.querySelectorAll("[data-ldel]").forEach(b=>b.onclick=async()=>{ const { error } = await sb.from("meal_items").delete().eq("id",b.dataset.ldel); if(error) return toast(error.message); items.splice(items.findIndex(i=>i.id===b.dataset.ldel),1); draw(); drawTot(); });
      box.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=async()=>{ const { error } = await sb.from("diet_plan_items").delete().eq("id",b.dataset.pdel); if(error) return toast(error.message); plan.splice(plan.findIndex(i=>i.id===b.dataset.pdel),1); draw(); drawTot(); });
      box.querySelector("[data-ladd]")&&(box.querySelector("[data-ladd]").onclick=()=>openFoodPicker("سجّل في "+mealName(p,m), async(food,qty)=>{
        const { data:ins, error } = await sb.from("meal_items").insert({client_id:p.id,log_date:S.date,meal_no:m,food_id:food.id,food_name:food.name,unit:food.unit,qty,...foodCalc(food,qty)}).select().single();
        if(error) return toast(error.message); items.push(ins); draw(); drawTot(); toast("✓ اتسجل"); }));
      box.querySelector("[data-padd]")&&(box.querySelector("[data-padd]").onclick=()=>openFoodPicker("أضف لخطة "+mealName(p,m), async(food,qty)=>{
        const { data:ins, error } = await sb.from("diet_plan_items").insert({client_id:p.id,meal_no:m,position:mp.length,food_id:food.id,food_name:food.name,unit:food.unit,qty,...foodCalc(food,qty)}).select().single();
        if(error) return toast(error.message); plan.push(ins); draw(); drawTot(); toast("✓ اتضاف للخطة"); }));
    };
    draw(); wrap.appendChild(box);
  }
}

    const list=all.filter(n=>(!q||n.includes(q))&&(!f||(f==="yes")===!!map[n])).slice(0,80);
    $("#vl").innerHTML=list.map(n=>`<div class="edit-ex" data-n="${esc(n)}"><div class="between"><b>${map[n]?"🎬":"⚪"} ${esc(n)}</b>${map[n]?`<button class="btn sm" data-play>▶</button>`:""}</div>
      <div class="row" style="margin-top:6px"><input class="grow" data-url placeholder="https://youtu.be/…" value="${esc(map[n]||"")}"><button class="btn sm primary" data-save>حفظ</button></div></div>`).join("")||emptyBox("🔎","مفيش نتائج");
    $("#vl").querySelectorAll("[data-n]").forEach(r=>{ const n=r.dataset.n;
      r.querySelector("[data-save]").onclick=async()=>{ const url=r.querySelector("[data-url]").value.trim();
        const { error } = url? await sb.from("exercise_videos").upsert({name:n,video_url:url,updated_at:new Date().toISOString()}) : await sb.from("exercise_videos").delete().eq("name",n);
        if(error) return toast(error.message); if(url) map[n]=url; else delete map[n]; await loadVideos(); toast(url?"✓ اتحفظ الفيديو":"اتشال الفيديو"); draw(); };
      r.querySelector("[data-play]")&&(r.querySelector("[data-play]").onclick=()=>openVideo({name:n})); }); };
  $("#vq").oninput=draw; $("#vf").onchange=draw;
  $("#vAdd").onclick=()=>{ const n=$("#vNew").value.trim().toUpperCase(); if(!n) return; if(!all.includes(n)) all.unshift(n); $("#vq").value=n; $("#vNew").value=""; draw(); };
  draw();
}

/* ======================================================================
   COACH: FOODS
   ====================================================================== */
async function viewFoods(el){
  el.innerHTML=`<div class="card dark"><div class="card-h"><div class="ic">🍎</div><h2>قاعدة بيانات الأطعمة<small id="fc">خاصة – العملاء بيبحثوا فيها بس، مش بيشوفوها كاملة</small></h2></div></div>
    <div class="card"><input id="fq" placeholder="🔍 ابحث…"><div id="fl" style="margin-top:8px"></div></div>
    <div class="card"><div class="card-h"><div class="ic acc">➕</div><h2>صنف جديد<small>جم/مل: القيم لكل 100 · حبة/شريحة: اكتب قيم القطعة الواحدة</small></h2></div>
     <label class="f">الاسم<input id="fn"></label>
     <div class="grid3"><label class="f">الوحدة<select id="fu">${["جم","مل","حبة","شريحة","قطعة","كوب","ملعقة كبيرة","سكوب","رغيف"].map(u=>`<option>${u}</option>`).join("")}</select></label>
     <label class="f">سعرات<input id="fk" inputmode="decimal"></label><label class="f">بروتين<input id="fp" inputmode="decimal"></label>
     <label class="f">كارب<input id="fcb" inputmode="decimal"></label><label class="f">دهون<input id="ff" inputmode="decimal"></label></div>
     <p class="hint" id="fuHint"></p><button class="btn primary block" id="fAdd">إضافة</button></div>`;
  const { count } = await sb.from("foods").select("id",{count:"exact",head:true}); $("#fc").textContent=fmt(count)+" صنف · خاصة – العملاء بيبحثوا فيها بس";
  const hint=()=>{ const u=$("#fu").value; $("#fuHint").innerHTML=COUNT_UNITS(u)?`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fone" checked style="width:auto;min-height:0"> القيم اللي كتبتها لـ ${u} واحدة</label>`:`القيم لكل 100 ${u}.`; };
  $("#fu").onchange=hint; hint();
  let timer; $("#fq").oninput=()=>{ clearTimeout(timer); timer=setTimeout(async()=>{
    const q=$("#fq").value.trim(); if(q.length<2){ $("#fl").innerHTML=""; return; }
    const { data } = await sb.from("foods").select("*").ilike("name",`%${q.replace(/[%_,()]/g," ")}%`).limit(40);
    $("#fl").innerHTML=(data||[]).map(f=>{ const u=unitInfo(f); return `<div class="food-r"><div class="fi">${u.cnt?"🍞":"⚖"}</div><div class="nm">${esc(f.name)}<small>${esc(f.category||"")} · ${u.base}: ${fmt(u.per.kcal)} kcal · ب ${fmt(u.per.P,1)} · ك ${fmt(u.per.C,1)} · د ${fmt(u.per.F,1)}</small></div></div>`; }).join("")||emptyBox("🔎","مفيش نتائج");
  },250); };
  $("#fAdd").onclick=async()=>{
    const k=$("#fone")?.checked?100:1;
    const rec={name:$("#fn").value.trim(),unit:$("#fu").value,kcal:(num($("#fk").value)||0)*k,protein:(num($("#fp").value)||0)*k,carbs:(num($("#fcb").value)||0)*k,fat:(num($("#ff").value)||0)*k,source:"الكوتش"};
    if(!rec.name) return toast("اكتب اسم الصنف");
    const { error } = await sb.from("foods").insert(rec); if(error) return toast(error.message); toast("✓ اتضاف"); viewFoods(el);
  };
}

boot();

</script>
