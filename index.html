<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Mofit</title>

/* 60% base #F8FAFC · 30% navy #0F172A · 10% orange #F97316 */
:root{
  --base:#F8FAFC; --card:#FFFFFF; --navy:#0F172A; --navy2:#1E293B; --navy-soft:#E2E8F0;
  --accent:#F97316; --accent-soft:#FFF7ED; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --good:#16A34A; --warn:#D97706; --bad:#DC2626; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--base);color:var(--ink);font:15px/1.5 "Segoe UI",Tahoma,system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* header (30%) */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:.5px}
.brand b{color:var(--accent)}
.top .who{flex:1;min-width:0;font-size:.85rem;color:#CBD5E1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:1px solid #334155;color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.85rem}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:auto}
/* bottom nav (30%) */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--navy);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:0;color:#94A3B8;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;padding:4px 0;cursor:pointer}
.nav button span{font-size:1.25rem;line-height:1}
.nav button.on{color:var(--accent)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:1rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 small{font-weight:400;color:var(--muted);font-size:.78rem;margin-inline-start:auto}
.sec-title{background:var(--navy);color:#fff;border-radius:var(--r) var(--r) 0 0;margin:-14px -14px 12px;padding:10px 14px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-title small{margin-inline-start:auto;color:#CBD5E1;font-weight:400;font-size:.78rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:420px){.grid4{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px}
.kpi .l{font-size:.72rem;color:#CBD5E1}
.kpi .v{font-size:1.35rem;font-weight:800;line-height:1.2}
.kpi .s{font-size:.7rem;color:#94A3B8}
.kpi.acc .v{color:var(--accent)}
.tile{background:var(--base);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile .l{font-size:.72rem;color:var(--muted)}
.tile .v{font-size:1.15rem;font-weight:700}
/* forms */
label.f{display:block;font-size:.78rem;color:var(--muted);margin-bottom:8px}
label.f > input,label.f > select,label.f > textarea{display:block;width:100%;margin-top:3px}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;min-height:42px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--bad);border-color:#FECACA}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1;min-width:120px}
.muted{color:var(--muted);font-size:.82rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem;min-height:34px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.cur{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.on.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{height:8px;background:var(--navy-soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over > i{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:7px 5px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--navy);color:#fff;font-weight:600;font-size:.75rem}
th:first-child{border-start-start-radius:8px} th:last-child{border-start-end-radius:8px}
td.cur,th.cur{background:var(--accent-soft)} th.cur{background:var(--accent)}
.scrollx{overflow-x:auto}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--base)}
.login .box{width:min(380px,100%);background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.login .head{background:var(--navy);color:#fff;padding:26px 22px}
.login .head h1{margin:0;font-size:2rem}
.login .head h1 b{color:var(--accent)}
.login .head p{margin:4px 0 0;color:#CBD5E1}
.login form{padding:22px}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
/* training */
.ex{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.ex-h{background:var(--navy);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px}
.ex-h .n{font-weight:700;font-size:.9rem;flex:1}
.ex-h .t{font-size:.72rem;color:#CBD5E1}
.ex-b{padding:8px 10px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 64px 44px 32px;gap:6px;align-items:center;margin-bottom:6px}
.set .no{font-weight:700;color:var(--muted);text-align:center}
.set input,.set select{min-height:40px;padding:6px;text-align:center}
.set .prev{grid-column:2/-1;font-size:.7rem;color:var(--muted);margin-top:-4px}
.fail{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:40px;cursor:pointer;font-size:1.05rem;filter:grayscale(1);opacity:.5}
.fail.on{filter:none;opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.more{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem}
.set-x{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 2fr;gap:6px;margin:-2px 0 8px}
.set-head{display:grid;grid-template-columns:26px 1fr 1fr 64px 44px 32px;gap:6px;font-size:.68rem;color:var(--muted);text-align:center;margin-bottom:4px}
.saved{font-size:.7rem;color:var(--good)}
.badge{display:inline-block;border-radius:99px;padding:1px 8px;font-size:.7rem;font-weight:700}
.badge.o{background:var(--accent);color:#fff}
.badge:empty{display:none}
.badge.n{background:var(--navy);color:#fff}
.badge.g{background:#DCFCE7;color:#166534}
/* nutrition */
.meal{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.meal-h{background:var(--navy);color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem}
.meal-h b{flex:1}
.meal-h span{font-size:.75rem;color:#CBD5E1}
.item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.85rem}
.item .nm{flex:1;min-width:0}
.item .nm small{display:block;color:var(--muted);font-size:.72rem}
.sugg{border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;background:#fff;margin-top:4px}
.sugg div{padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.85rem}
.sugg div:hover,.sugg div.sel{background:var(--accent-soft)}
.sugg div small{color:var(--muted)}
/* coach */
.client{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.client .nm{flex:1;min-width:0}
.client .nm small{display:block;color:var(--muted);font-size:.75rem;overflow:hidden;text-overflow:ellipsis}
.coachbar{background:var(--accent-soft);border:1px solid #FED7AA;border-radius:12px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:.85rem}
.coachbar b{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:.85rem;box-shadow:0 6px 20px rgba(15,23,42,.25)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
svg text{font-family:inherit}
.legend{display:flex;gap:12px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
</style>
</head>

const MOFIT_SYS = { key:"mofit", days:5, name:"برنامج Mofit (الشيت)", plan:[1,2,3,4,5].map(d=>({label:"Day "+d, ex:MOFIT_TEMPLATE.filter(e=>e.day_no===d).map(e=>[e.name,e.sets,null,null])})) };

function planRows(clientId, plan){
  const rows=[];
  plan.forEach((day,i)=>day.ex.forEach((e,j)=>rows.push({client_id:clientId,day_no:i+1,position:j,day_label:day.label,name:e[0],sets:e[1]||4,target_reps:e[2]||null,target_rir:e[3]||null,rest_sec:e[4]||null,tempo:e[5]||null,notes:e[6]||null})));
  return rows;
}
/* replace a client's program with a system or a saved coach template */
async function applyProgram(client, sys){
  const { error:de } = await sb.from("program_exercises").delete().eq("client_id",client.id);
  if(de) { toast(de.message); return false; }
  const { error } = await sb.from("program_exercises").insert(planRows(client.id, sys.plan));
  if(error) { toast(error.message); return false; }
  await sb.from("profiles").update({training_days:sys.plan.length, split_key:sys.key, split_name:sys.name}).eq("id",client.id);
  return true;
}
async function loadCoachTemplates(){
  const { data } = await sb.from("program_templates").select("*").order("created_at",{ascending:false});
  S.templates=(data||[]).map(t=>({key:"tpl:"+t.id, id:t.id, days:t.days, name:t.name, plan:t.plan, custom:true}));
}
function findSystem(key){ return SYSTEMS.find(s=>s.key===key) || (key==="mofit"?MOFIT_SYS:null) || (S.templates||[]).find(t=>t.key===key); }
function systemPicker(days, selected){
  const list=SYSTEMS.filter(s=>s.days===days);
  const rec=list.find(s=>s.rec);
  const coach=[...(S.templates||[]).filter(t=>t.days===days), ...(days===5?[MOFIT_SYS]:[])];
  return `<option value="${rec?rec.key:""}">⭐ الموصى به (${esc(rec?.name||"")})</option>
    ${coach.length?`<optgroup label="✍ برنامج الكوتش">${coach.map(t=>`<option value="${t.key}" ${selected===t.key?"selected":""}>✍ ${esc(t.name)}</option>`).join("")}</optgroup>`:""}
    <optgroup label="الأنظمة">${list.map(s=>`<option value="${s.key}" ${selected===s.key?"selected":""}>${esc(s.name)}</option>`).join("")}</optgroup>`;
}
function systemPreview(sys){
  if(!sys) return "";
  return sys.plan.map((d,i)=>`<div style="margin-top:6px"><span class="badge n">يوم ${i+1}</span> <b style="font-size:.85rem">${esc(d.label)}</b><div class="muted">${d.ex.map(e=>esc(e[0])+" ("+(e[1]||4)+"×"+(e[2]||"—")+")").join(" · ")}</div></div>`).join("");
}
/* wires a days-select + system-select + preview inside root */
function wireSystemPicker(root, current){
  const dSel=root.querySelector("[data-sys-days]"), sSel=root.querySelector("[data-sys]"), pv=root.querySelector("[data-sys-pv]");
  const refresh=(keep)=>{ sSel.innerHTML=systemPicker(+dSel.value, keep); pv.innerHTML=systemPreview(findSystem(sSel.value)); };
  dSel.onchange=()=>refresh(null); sSel.onchange=()=>pv.innerHTML=systemPreview(findSystem(sSel.value));
  refresh(current);
}

/* ---------- auth ---------- */
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault(); $("#loginErr").textContent="";
  const { error } = await sb.auth.signInWithPassword({ email:$("#loginEmail").value.trim(), password:$("#loginPass").value });
  if(error){ $("#loginErr").textContent="الإيميل أو كلمة السر غير صحيحة"; return; }
  boot();
});
$("#logoutBtn").onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("#loginView").classList.remove("hidden"); $("#appView").classList.add("hidden"); return; }
  const { data:me, error } = await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(error||!me){ toast("تعذر تحميل الحساب"); return; }
  if(!me.active){ await sb.auth.signOut(); $("#loginView").classList.remove("hidden"); $("#loginErr").textContent="الحساب غير مفعّل – تواصل مع الكوتش"; return; }
  S.me=me;
  $("#loginView").classList.add("hidden"); $("#appView").classList.remove("hidden");
  if(me.role==="coach"){ S.tab="clients"; await Promise.all([loadClients(),loadCoachTemplates()]); }
  else { await openClient(me); }
  render();
}

async function openClient(p){
  S.client=p; S.week=currentWeek(p); S.date=today();
  const { data } = await sb.from("program_exercises").select("*").eq("client_id",p.id).order("day_no").order("position");
  S.program=data||[];
  const days=[...new Set(S.program.map(e=>e.day_no))];
  const dow=((daysBetween(p.start_date||today(),today())%7)+7)%7+1;
  S.day = days.includes(dow)?dow:(days[0]||1);
}

function dayLabel(d){ const e=S.program.find(x=>x.day_no===d&&x.day_label); return e?e.day_label:""; }

}
function sumMacros(items){ return items.reduce((a,i)=>({kcal:a.kcal+(+i.kcal||0),P:a.P+(+i.protein||0),C:a.C+(+i.carbs||0),F:a.F+(+i.fat||0)}),{kcal:0,P:0,C:0,F:0}); }
function macroBars(tot,t){
  const row=(l,v,goal,u)=>{ const r=goal?v/goal:0; return `<div class="tile"><div class="l">${l}</div><div class="v">${fmt(v)} <span class="muted">/ ${fmt(goal)} ${u}</span></div><div class="bar ${r>1.05?"over":""}"><i style="width:${Math.min(r,1)*100}%"></i></div><div class="muted">${goal?pct(r):"الهدف غير محدد"}</div></div>`; };
  return `<div class="grid2">${row("السعرات",tot.kcal,t.kcal,"kcal")}${row("بروتين",tot.P,t.P,"جم")}${row("كارب",tot.C,t.C,"جم")}${row("دهون",tot.F,t.F,"جم")}</div>
   <p class="muted" style="margin:8px 0 0">المتبقي: <b>${t.kcal?fmt(t.kcal-tot.kcal):"—"}</b> kcal</p>`;
}

/* ---------- muscle-failure tracker ---------- */
function failureSummary(sets){
  const done=sets.filter(s=>s.reps!==null||s.weight!==null);
  if(!done.length) return `<p class="empty">لم تُسجل مجموعات هذا الأسبوع بعد</p>`;
  const fail=done.filter(isFailure).length;
  const near=done.filter(s=>!isFailure(s)&&s.rir!==null&&+s.rir<=2).length;
  const far=done.length-fail-near;
  const rir=avg(done.map(s=>s.rir));
  const w=v=>(v/done.length*100).toFixed(1)+"%";
  return `<div class="grid4">
    <div class="tile"><div class="l">مجموعات مسجلة</div><div class="v">${done.length}</div></div>
    <div class="tile"><div class="l">🔥 للفشل (RIR 0)</div><div class="v" style="color:var(--accent)">${fail}</div></div>
    <div class="tile"><div class="l">قريبة (RIR 1-2)</div><div class="v">${near}</div></div>
    <div class="tile"><div class="l">متوسط RIR</div><div class="v">${fmt(rir,1)}</div></div></div>
    <div class="bar" style="height:12px;display:flex;margin-top:10px"><i style="width:${w(fail)};border-radius:0;background:var(--accent)"></i><i style="width:${w(near)};border-radius:0;background:var(--navy)"></i><i style="width:${w(far)};border-radius:0;background:var(--navy-soft)"></i></div>
    <div class="legend" style="margin-top:6px"><span><i style="background:var(--accent)"></i>فشل</span><span><i style="background:var(--navy)"></i>RIR 1-2</span><span><i style="background:var(--navy-soft)"></i>RIR 3+ / غير محدد</span></div>`;
}

/* ---------- charts (inline SVG) ---------- */
function lineChart(pts,unit){
  pts=pts.filter(p=>p.y!==null&&!isNaN(p.y));
  if(pts.length<2) return `<p class="muted" style="margin:10px 0 0">المنحنى بيظهر بعد تسجيل قياسين أو أكثر.</p>`;
  const W=320,H=130,pl=34,pr=10,pt=10,pb=22;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  let y0=Math.min(...ys), y1=Math.max(...ys); if(y0===y1){y0-=1;y1+=1;} const pad=(y1-y0)*.15; y0-=pad; y1+=pad;
  const x0=Math.min(...xs), x1=Math.max(...xs)||1;
  const X=x=>pl+(x-x0)/((x1-x0)||1)*(W-pl-pr), Y=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
  const d=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const ticks=[y0+(y1-y0)*.15,(y0+y1)/2,y1-(y1-y0)*.15];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:10px" direction="ltr">
    ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E2E8F0"/><text x="${pl-4}" y="${Y(v)+3}" font-size="9" fill="#64748B" text-anchor="end">${v.toFixed(1)}</text>`).join("")}
    <path d="${d}" fill="none" stroke="#0F172A" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${i===pts.length-1?4:3}" fill="${i===pts.length-1?"#F97316":"#0F172A"}"/><text x="${X(p.x)}" y="${H-6}" font-size="9" fill="#64748B" text-anchor="middle">${p.x===0?"ب":"أ"+p.x}</text>`).join("")}
  </svg><p class="muted" style="margin:0">${unit} · ب = البداية · أ = الأسبوع</p>`;
}

    const move=async dir=>{ const j=idx+dir; if(j<0||j>=exs.length) return; const a=exs[idx], b=exs[j];
      await Promise.all([sb.from("program_exercises").update({position:j}).eq("id",a.id), sb.from("program_exercises").update({position:idx}).eq("id",b.id)]);
      exs.forEach((e,i)=>e.position=i); a.position=j; b.position=idx; S.program.sort((x,y)=>x.day_no-y.day_no||x.position-y.position); viewSetup(el); };
    d.querySelector("[data-up]").onclick=()=>move(-1); d.querySelector("[data-dn]").onclick=()=>move(1);
    list.appendChild(d);
  });
  $("#exAdd").onclick=async()=>{
    const name=prompt("اسم التمرين"); if(!name) return;
    const { data, error } = await sb.from("program_exercises").insert({client_id:p.id,day_no:S.day,position:exs.length,name:name.trim().toUpperCase(),sets:4,day_label:dayLabel(S.day)||null}).select().single();
    if(error) return toast(error.message); S.program.push(data); viewSetup(el);
  };
  $("#gp").onclick=()=>$("#newPass").value=genPass();
  const call=async body=>{ const { data, error } = await sb.functions.invoke("coach-admin",{body}); const msg=error?((await error.context?.json?.().catch(()=>null))?.error||error.message):data?.error; if(msg){toast(msg);return false;} return true; };
  $("#sp").onclick=async()=>{ const pw=$("#newPass").value; if(await call({action:"set_password",user_id:p.id,password:pw})) toast("✓ كلمة السر الجديدة: "+pw); };
  $("#act").onclick=async()=>{ const { data, error } = await sb.from("profiles").update({active:!p.active}).eq("id",p.id).select().single(); if(error) return toast(error.message); S.client=data; viewSetup(el); };
  $("#del").onclick=async()=>{ if(!confirm("حذف العميل وكل بياناته نهائياً؟ لا يمكن التراجع.")) return; if(await call({action:"delete_client",user_id:p.id})){ S.client=null; S.tab="clients"; await loadClients(); render(); } };
}

/* ---------- coach: foods ---------- */
async function viewFoods(el){
  el.innerHTML=`<div class="card"><div class="sec-title">قاعدة بيانات الأطعمة<small id="fc"></small></div>
    <input id="fq" placeholder="🔍 ابحث…"><div id="fl" style="margin-top:8px"></div></div>
    <div class="card"><div class="sec-title">➕ صنف جديد<small>القيم لكل 100 من الوحدة</small></div>
     <label class="f">الاسم<input id="fn"></label>
     <div class="grid3"><label class="f">الوحدة<select id="fu"><option>جم</option><option>مل</option><option>حبة</option></select></label>
     <label class="f">سعرات<input id="fk" inputmode="decimal"></label><label class="f">بروتين<input id="fp" inputmode="decimal"></label>
     <label class="f">كارب<input id="fcb" inputmode="decimal"></label><label class="f">دهون<input id="ff" inputmode="decimal"></label></div>
     <button class="btn primary" id="fAdd" style="width:100%">إضافة</button></div>`;
  const { count } = await sb.from("foods").select("id",{count:"exact",head:true}); $("#fc").textContent=fmt(count)+" صنف";
  let timer; $("#fq").oninput=()=>{ clearTimeout(timer); timer=setTimeout(async()=>{
    const q=$("#fq").value.trim(); if(q.length<2){ $("#fl").innerHTML=""; return; }
    const { data } = await sb.from("foods").select("*").ilike("name",`%${q.replace(/[%_,()]/g," ")}%`).limit(40);
    $("#fl").innerHTML=(data||[]).map(f=>`<div class="item" style="padding:8px 0"><div class="nm">${esc(f.name)}<small>${esc(f.category||"")} · لكل 100 ${esc(f.unit)}: ${fmt(f.kcal)} kcal · ب ${fmt(f.protein,1)} · ك ${fmt(f.carbs,1)} · د ${fmt(f.fat,1)}</small></div></div>`).join("")||`<p class="muted">مفيش نتائج</p>`;
  },250); };
  $("#fAdd").onclick=async()=>{
    const rec={name:$("#fn").value.trim(),unit:$("#fu").value,kcal:num($("#fk").value)||0,protein:num($("#fp").value)||0,carbs:num($("#fcb").value)||0,fat:num($("#ff").value)||0,source:"الكوتش"};
    if(!rec.name) return toast("اكتب اسم الصنف");
    const { error } = await sb.from("foods").insert(rec); if(error) return toast(error.message); toast("✓ اتضاف"); viewFoods(el);
  };
}

boot();
</script>
